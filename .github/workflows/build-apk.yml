name: Build EdgeAssist APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q EdgeAssistTouch.zip -d extracted
          cp -r extracted/EdgeAssist/. .

      - name: Fix Android SDK version
        run: |
          sed -i 's/compileSdkVersion 27/compileSdkVersion 29/' app/build.gradle
          sed -i 's/buildToolsVersion "27.0.3"/buildToolsVersion "29.0.2"/' app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 29
        run: |
          yes | sdkmanager "platforms;android-29" "build-tools;29.0.2"

      - name: Setup Java 11 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.7.1'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EdgeAssist-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
